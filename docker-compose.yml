name: interview-bank

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: interview_bank
      MYSQL_USER: ${DB_USERNAME:-interview}
      MYSQL_PASSWORD: ${DB_PASSWORD:-interview_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-13307}:3306"
    volumes:
      - interview_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' interview_bank >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: 8090
      DB_URL: "jdbc:mysql://mysql:3306/interview_bank?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: ${DB_USERNAME:-interview}
      DB_PASSWORD: ${DB_PASSWORD:-interview_pass}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${API_PORT:-18089}:8090"

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-18090}:80"

volumes:
  interview_mysql_data:
