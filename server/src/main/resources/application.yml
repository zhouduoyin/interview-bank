server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: interview-bank
  profiles:
    default: h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      static-locations: file:./web/dist/,classpath:/static/
      cache:
        cachecontrol:
          max-age: 0
  h2:
    console:
      enabled: false

app:
  spa:
    enabled: true

logging:
  level:
    root: INFO
    com.interviewbank: INFO
